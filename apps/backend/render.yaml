services:
  - type: web
    name: skypulse-tools-api
    runtime: python
    rootDir: apps/backend
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: prod
      - key: CORS_ORIGINS
        sync: false
      # Dominio público del sitio (origen https, sin ruta): link de las notificaciones push y User-Agent hacia AWC y
      # el SMN. Sin declararla vale https://skypulse-ar.vercel.app; con un valor inválido el servicio no arranca.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CHECKWX_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Alertas push (FRA-354 / FRA-355). Los valores se cargan a mano en el panel de Render.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: ALERTAS_EVALUAR_URL
        sync: false
      # El envío automático nace apagado; encenderlo es un cambio explícito de esta variable (PR5c: con "true", la
      # clave `alertas:apagado` ausente de Upstash y una VAPID_PRIVATE_KEY usable, /evaluar MANDA las notificaciones).
      # OJO: el servicio real de Render NO se sincroniza desde este blueprint (su comando de inicio y su nombre
      # difieren), así que este archivo documenta las variables y sus valores iniciales: lo que vale es el valor
      # cargado en el panel de Render, y cambiarlo ahí no se pisa solo.
      - key: ALERTAS_ENVIO_ACTIVO
        value: "false"
      # Evaluación en seco (PR5b): con "true" el endpoint /evaluar consulta a Open-Meteo y CUENTA las zonas con
      # tormenta, pero no manda ninguna notificación. Nace apagada; se enciende cambiando el valor en el panel de
      # Render (que es el que vale, ver arriba). La clave `alertas:apagado` de Upstash la detiene en cualquier
      # momento. Tienen valor por defecto y no hace falta declararlas: ALERTAS_MAX_ZONAS_POR_CORRIDA (50, el
      # catálogo), ALERTAS_LOCK_TTL_SEGUNDOS (600) y ALERTAS_PLAZO_CORRIDA_SEGUNDOS (480, tiene que ser menor que
      # la vida del lock).
      - key: ALERTAS_EVALUAR_EN_SECO
        value: "false"
      # Aviso de LLUVIA persistente (opt-in, lluvia PR 3a): con "true", una corrida que ya manda (ALERTAS_ENVIO_ACTIVO y la
      # clave `alertas:apagado` ausente) avisa además por lluvia a quien la pidió, después de la tormenta y solo en las
      # zonas sin tormenta. Nace apagado: con "false" la lluvia solo se cuenta en el log (`con_lluvia`) y la corrida es la
      # de siempre. Se enciende cambiando el valor en el panel de Render (que es el que vale, ver arriba).
      - key: ALERTAS_LLUVIA_ACTIVA
        value: "false"
