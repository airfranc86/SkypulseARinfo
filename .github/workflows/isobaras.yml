# Pressure map (isobars): builds the files the /mapa page reads from NOAA GFS and publishes them on GitHub Pages.
#
# - Every pull request that touches the pipeline runs `test` (this is where eccodes is first installed on Linux).
# - `schedule` runs 4 h 45 min after each model cycle (00/06/12/18 UTC) and retries one hour later. If the cycle
#   is already published the run ends without deploying, so the retry costs almost nothing.
# - `publicar` only runs from main (schedule or manual) and only deploys when there is a new cycle.
# Pages replaces the whole site on each deploy: the artifact is exactly `scripts/isobaras/out`.
name: isobaras

on:
  pull_request:
    paths:
      - "scripts/isobaras/**"
      - ".github/workflows/isobaras.yml"
  schedule:
    - cron: "45 4,10,16,22 * * *"
    - cron: "45 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs (cron, retry, manual) share one group and queue; a pull request has its own group so its tests
# never take the single pending slot of a scheduled run.
concurrency:
  group: isobaras-${{ github.event_name == 'pull_request' && github.ref || 'publicar' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: scripts/isobaras

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scripts/isobaras/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scripts/isobaras/uv.lock
      - run: uv sync --locked
      - id: generar
        run: uv run python -m isobaras_core.pipeline --salida out --github-output "$GITHUB_OUTPUT"
      - if: steps.generar.outputs.publicar == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.generar.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: scripts/isobaras/out
      - id: deploy
        if: steps.generar.outputs.publicar == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
